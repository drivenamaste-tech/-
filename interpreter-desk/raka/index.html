<title>通訳 ラカ・プラタマ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+Myanmar:wght@400;700&display=swap">
<style>
/* Layout: 上に本人の名刺（写真・今の様子）、次に通訳3モードのボタン、下にプロフィール（趣味・1日の過ごし方）と文字での通訳。 */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e7ecea; --line:#d0d9d6;
  --fg:#18231f; --muted:#56655f; --c:#b3261e; --c-soft:#f8e3e1; --c-fg:#ffffff;
  --sleep:#c9d3e6; --rest:#f1dfb3; --work:#e8a59f; --jp:#e9eef6; --jp-line:#cbd6e6; --warn:#9a5f08; --bad:#b0362a;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --f-my:"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211e; --sunk:#222c28; --line:#34423d;
  --fg:#e6ece9; --muted:#9aaaa3; --c:#f08a80; --c-soft:#3a2321; --c-fg:#16110c;
  --sleep:#2c3850; --rest:#4a3d22; --work:#7a3a34; --jp:#1e2733; --jp-line:#334256; --warn:#e0a54a; --bad:#ef7d70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --sunk:#222c28; --line:#34423d;
  --fg:#e6ece9; --muted:#9aaaa3; --c:#f08a80; --c-soft:#3a2321; --c-fg:#16110c;
  --sleep:#2c3850; --rest:#4a3d22; --work:#7a3a34; --jp:#1e2733; --jp-line:#334256; --warn:#e0a54a; --bad:#ef7d70; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;padding-block:16px 40px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.84rem}
.label{font-size:.74rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.btn{border:1px solid var(--c);background:var(--c);color:var(--c-fg);border-radius:8px;padding:.5em 1.1em;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--fg);font-weight:400;padding:.3em .8em;font-size:.84rem}
.back{justify-self:start}

/* 名刺 */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c)}
.hero img{width:112px;height:112px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--c)}
.hero h1{font-size:1.7rem;font-weight:900;letter-spacing:.03em}
.hero .native{font-size:.9rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.76rem;border-radius:999px;padding:.1em .7em;background:var(--c-soft);color:var(--fg);font-weight:700}
.now{margin-top:8px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.now b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.work{background:var(--c)} .dot.rest{background:#d39b2a} .dot.sleep{background:#6c7fa8}
@media (max-width:520px){.hero{grid-template-columns:1fr;text-align:left}.hero img{width:88px;height:88px}}

/* モード */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.mode h3{font-size:1.05rem}
.mode .go{display:block;text-decoration:none;text-align:center;border-radius:10px;padding:.75em 1em;background:var(--c);color:var(--c-fg);font-weight:700;margin-top:auto}
.mode .go small{display:block;font-weight:400;font-size:.74rem;opacity:.9}
.mode ul{margin:0;padding-left:1.1em;font-size:.86rem;color:var(--muted)}
.mode.lesson .go{background:transparent;color:var(--c);border:1.5px solid var(--c)}

/* プロフィール */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
dl.prof{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.92rem}
dl.prof dt{color:var(--muted);white-space:nowrap}
dl.prof dd{margin:0}
.day{display:grid;gap:6px}
.bar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line);position:relative}
.bar span{height:100%}
.bar .sleep{background:var(--sleep)} .bar .rest{background:var(--rest)} .bar .work{background:var(--work)}
.bar i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sched{display:grid;gap:2px;font-size:.86rem}
.sched div{display:grid;grid-template-columns:8.6em minmax(0,1fr);gap:8px;padding:3px 6px;border-radius:6px}
.sched div.cur{background:var(--c-soft);font-weight:700}
.sched b{font-variant-numeric:tabular-nums;font-weight:400;color:var(--muted)}

/* 文字で通訳 */
details.text{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.text summary{cursor:pointer;font-weight:700;font-family:var(--f-display)}
details.text[open] summary{margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:.3em .9em;font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--c-fg)}
textarea{width:100%;min-height:110px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.my{font-family:var(--f-my);line-height:2}
.log{display:grid;gap:10px;margin-top:12px}
.entry{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.entry .src{padding:8px 12px;font-size:.88rem;color:var(--muted);white-space:pre-wrap;word-break:break-word;border-bottom:1px dashed var(--line)}
.entry .out{padding:10px 12px;font-size:1.05rem;white-space:pre-wrap;word-break:break-word}
.entry .back2{padding:8px 12px;font-size:.84rem;background:var(--jp);border-top:1px solid var(--jp-line);white-space:pre-wrap}
.entry .notes{padding:8px 12px;font-size:.84rem;display:grid;gap:4px;border-top:1px solid var(--line)}
.entry .notes div{border-left:3px solid var(--warn);padding-left:8px}
.notice{background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <button type="button" class="btn quiet back" id="ai-back" hidden>← AI社員一覧へ</button>

  <section class="hero" aria-label="プロフィール">
    <img id="photo" alt="">
    <div>
      <p class="label">登録支援機関部・通訳</p>
      <h1 id="name"></h1>
      <p class="native" id="native"></p>
      <div class="chips" id="chips"></div>
      <p class="now" id="now"></p>
    </div>
  </section>

  <section aria-labelledby="modesTitle">
    <h2 id="modesTitle" style="margin-bottom:10px">仕事を頼む</h2>
    <div class="modes" id="modes"></div>
    <p class="muted small" style="margin-top:8px">ボタンを押すと音声通話が新しいタブで開きます。マイクの使用を許可してください。終わるときは「通訳終了」と言うか、タブを閉じてください。</p>
  </section>

  <section class="card" aria-labelledby="profTitle">
    <h2 id="profTitle">プロフィール</h2>
    <dl class="prof" id="prof"></dl>
    <div class="day">
      <p class="label">1日の過ごし方（現地時間）</p>
      <div class="bar" id="bar" aria-hidden="true"></div>
      <div class="ticks"><span>0時</span><span>6時</span><span>12時</span><span>18時</span><span>24時</span></div>
      <div class="sched" id="sched"></div>
    </div>
  </section>

  <details class="text" id="textBox">
    <summary>文字で通訳する（声が使えないとき）</summary>
    <div class="seg" id="dir"></div>
    <textarea id="src"></textarea>
    <div class="row">
      <button class="btn" id="go" type="button">通訳する</button>
      <span class="muted small" id="st" aria-live="polite"></span>
    </div>
    <div class="log" id="log"></div>
  </details>

  <p class="notice">通訳の音声通話はElevenLabsのサービスで動きます。通訳用の通話は音声を録音せず、会話の文字記録は7日で消える設定です。在留カード番号などの個人情報は、通訳に必要な場合だけ話してください。AIの通訳は補助です。雇用条件など重要な内容は、必要に応じて人の通訳者に確認してください。</p>
</div>

function tick(){
  let h = 0, txt = "";

    const parts = new Intl.DateTimeFormat("ja-JP",{timeZone:P.tz,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
    const H = +parts.find(p=>p.type==="hour").value, M = +parts.find(p=>p.type==="minute").value;
    h = H + M/60; txt = `${String(H).padStart(2,"0")}:${String(M).padStart(2,"0")}`;
  }catch{ return; }
  const cur = P.day.find(([a,b]) => h >= a && h < b) || P.day[0];
  marker.style.left = (h/24*100)+"%";
  document.querySelectorAll("#sched div").forEach(d => d.classList.toggle("cur", +d.dataset.a===cur[0]));

    w.append(s, o);
    if (en.back){ const b = document.createElement("div"); b.className = "back2"; b.textContent = (en.dir==="ja2fg" ? "逆翻訳：" : "直訳に近い意味：") + en.back; w.appendChild(b); }
    if (en.notes && en.notes.length){ const n = document.createElement("div"); n.className = "notes"; en.notes.forEach(x => { const d = document.createElement("div"); d.textContent = x; n.appendChild(d); }); w.appendChild(n); }
    el.appendChild(w);
  });
}
async function go(){
  const text = $("src").value.trim(); if (!text || busy || !sample) return;
  const from = dir==="ja2fg" ? "日本語" : P.lang, to = dir==="ja2fg" ? P.lang : "日本語";
  const en = {dir, src:text}; entries.push(en); busy = true; $("go").disabled = true; $("st").textContent = `${P.short}が通訳しています…`; renderLog();
  try{
    const r = await sample.json(`${P.persona}
次の${from}を${to}に通訳してください。意味を足さず削らず、数字・金額・日付・固有名詞は原文どおり。${P.my ? "ミャンマー語はUnicodeの標準的なビルマ文字で書く。" : ""}
次のJSONだけを返す：{"translation":"${to}の訳文","back_translation":"${dir==="ja2fg"?"訳文を日本語に戻した文":"直訳に近い日本語"}","notes":["日本人スタッフ向けの確認点（日本語・短く）。なければ空配列"]}
原文：
${text}`, {modelTier:"default", cache:false});
    en.out = String(r?.translation ?? "").trim(); en.back = String(r?.back_translation ?? "").trim();
    en.notes = Array.isArray(r?.notes) ? r.notes.map(String).filter(Boolean) : [];
    if (!en.out) en.err = "訳文が空でした。もう一度お試しください。"; else $("src").value = "";
  }catch(e){ en.err = e && e.code==="rate_limited" ? "利用が集中しています。少し待ってからお試しください。" : "通訳結果を受け取れませんでした。もう一度お試しください。"; }
  finally{ busy = false; $("go").disabled = false; $("st").textContent = ""; renderLog(); }
}
$("go").onclick = go;
$("src").addEventListener("keydown", e => { if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); go(); } });
renderDir();
})();
</script>
